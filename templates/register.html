<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte — ThermoСool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-box">
        <div class="auth-logo">
            <div class="logo-emoji">❄️</div>
            <h1>Créer un compte</h1>
            <p>Rejoignez ThermoСool dès maintenant</p>
        </div>

        <div class="alert alert-err" id="alertErr"></div>
        <div class="alert alert-ok" id="alertOk"></div>

        <div class="form-group">
            <label class="form-label">Nom complet</label>
            <input type="text" class="form-input" id="full_name" placeholder="Prénom Nom">
        </div>
        <div class="form-group">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" class="form-input" id="username" placeholder="votre_username">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="email" placeholder="email@exemple.com">
        </div>
        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-input" id="password" placeholder="••••••••">
        </div>

        <button class="btn-auth" onclick="doRegister()">Créer mon compte</button>

        <div class="auth-footer">
            Déjà un compte ? <a href="/login">Se connecter</a>
        </div>
    </div>
</div>

<script>
async function doRegister() {
    const err = document.getElementById('alertErr');
    const ok  = document.getElementById('alertOk');
    const btn = document.querySelector('.btn-auth');

    const full_name = document.getElementById('full_name').value.trim();
    const username  = document.getElementById('username').value.trim();
    const email     = document.getElementById('email').value.trim();
    const password  = document.getElementById('password').value;

    if (!username || !email || !password) {
        err.textContent = 'Veuillez remplir tous les champs obligatoires.';
        err.classList.add('show'); ok.classList.remove('show'); return;
    }
    if (password.length < 6) {
        err.textContent = 'Le mot de passe doit avoir au moins 6 caractères.';
        err.classList.add('show'); ok.classList.remove('show'); return;
    }

    btn.disabled = true; btn.textContent = 'Création...';
    err.classList.remove('show'); ok.classList.remove('show');

    try {
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name, username, email, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
            ok.textContent = 'Compte créé ! Redirection...';
            ok.classList.add('show');
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            err.textContent = data.message || 'Erreur lors de la création.';
            err.classList.add('show');
            btn.disabled = false; btn.textContent = 'Créer mon compte';
        }
    } catch {
        err.textContent = 'Erreur réseau. Réessayez.';
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Créer mon compte';
    }
}
</script>
</body>
</html>
